<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track your application &mdash; Allied Bank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow">
  <div class="eyebrow">Application status</div>
  <h1 id="ref">MO-&mdash;</h1>
  <div class="sub" id="biz"></div>

  <div class="card" style="margin-top:28px" id="timeline"></div>

  <div class="sub" style="margin-top:16px;font-size:16px">The merchant only ever sees status and a plain-language reason here &mdash; never the internal risk score or check details.</div>

  <a class="sub" style="margin-top:20px;color:var(--primary);font-weight:600" href="index.html">&larr; Back to start</a>
</div>
<script src="app.js"></script>
<script>
const caseId = qs('case');
async function load() {
  const t = await api('GET', `/api/cases/${caseId}/tracking`);
  document.getElementById('ref').textContent = t.reference;
  document.getElementById('biz').textContent = `${t.business_name || ''} — ${t.message}`;
  const subs = {
    'Submitted': 'Case received',
    'Checks complete': 'All checks run',
    'Activated': t.status === 'activated' || t.status === 'approved' || t.status === 'approved_limits' ? 'Product issued' : 'Pending outcome',
    'Device confirmed': 'Pending first scan'
  };
  document.getElementById('timeline').innerHTML = t.steps.map((s, i) => `
    <div class="timeline-item">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="timeline-dot ${s.done ? 'done' : 'todo'}">${s.done ? '&#10003;' : (i + 1)}</div>
        ${i < t.steps.length - 1 ? `<div class="timeline-line ${s.done ? 'done' : ''}"></div>` : ''}
      </div>
      <div class="timeline-body">
        <div class="timeline-title ${s.done ? 'done' : ''}">${s.title}</div>
        <div class="timeline-sub">${subs[s.title] || ''}</div>
      </div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
